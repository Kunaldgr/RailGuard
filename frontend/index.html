<!DOCTYPE html>
<html>
<head>
  <title>Railway Maintenance System</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #1a1a2e; color: white; padding: 20px 40px; }
    header h1 { margin: 0; font-size: 22px; }
    nav { display: flex; gap: 0; background: #16213e; padding: 0 40px; }
    nav button {
      background: none; border: none; color: #ccc; padding: 14px 24px;
      font-size: 15px; cursor: pointer; border-bottom: 3px solid transparent;
    }
    nav button.active { color: white; border-bottom: 3px solid #e94560; }
    main { padding: 30px 40px; }
    .tab { display: none; }
    .tab.active { display: block; }

    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px 14px; text-align: left; }
    th { background: #f0f0f0; }
    tr:hover { background: #f9f9f9; cursor: pointer; }
    .Repair-Now { color: #c0392b; font-weight: bold; }
    .Repair-Soon { color: #d68910; font-weight: bold; }
    .Safe-For-Now { color: #27ae60; }

    #search { padding: 10px; width: 280px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }

    .upload-box {
      background: white; border: 2px dashed #ccc; border-radius: 8px;
      padding: 40px; text-align: center; max-width: 500px;
    }
    .upload-box.dragover { border-color: #e94560; background: #fff5f6; }
    #imagePreview { max-width: 300px; margin-top: 15px; border-radius: 6px; display: none; }
    #imageResult {
      margin-top: 20px; padding: 16px; border-radius: 6px; display: none;
      font-size: 16px;
    }
    .result-Defective { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
    .result-NonDefective { background: #eafaf1; color: #27ae60; border: 1px solid #c3e6cb; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
    }
    .modal { background: white; padding: 24px; border-radius: 8px; max-width: 400px; width: 90%; }
    .modal h3 { margin-top: 0; }
    .modal-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
    .modal-close { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <header><h1>Railway Predictive Maintenance System</h1></header>
  <nav>
    <button id="tabBtnFleet" class="active" onclick="switchTab('fleet')">Fleet Monitor</button>
    <button id="tabBtnImage" onclick="switchTab('image')">Component Inspection</button>
  </nav>

  <main>
    <!-- FLEET TAB -->
    <div id="tab-fleet" class="tab active">
      <h2>Fleet Status</h2>
      <input type="text" id="search" placeholder="Search by train ID...">
      <table>
        <thead>
          <tr><th>Train ID</th><th>Priority</th><th>Failure Probability</th><th>Predicted Issue</th></tr>
        </thead>
        <tbody id="fleetBody"></tbody>
      </table>
    </div>

    <!-- IMAGE TAB -->
    <div id="tab-image" class="tab">
      <h2>Fastener / Track Component Inspection</h2>
      <p>Upload a photo of a fastener or track segment to check for defects.</p>
      <div class="upload-box" id="uploadBox">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <p>Drag & drop an image here, or <a href="#" onclick="document.getElementById('fileInput').click(); return false;">browse</a></p>
        <img id="imagePreview">
      </div>
      <div id="imageResult"></div>
    </div>
  </main>

  <!-- DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    const FLEET_API = "http://127.0.0.1:8000";
    const IMAGE_API = "http://127.0.0.1:8001";
    let allTrains = [];

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.getElementById('tabBtn' + (name === 'fleet' ? 'Fleet' : 'Image')).classList.add('active');
    }

    // ---- Fleet tab ----
    fetch(`${FLEET_API}/trains`)
      .then(res => res.json())
      .then(data => { allTrains = data; renderTable(allTrains); })
      .catch(err => {
        document.getElementById("fleetBody").innerHTML =
          `<tr><td colspan="4">Failed to load. Is the fleet backend running on port 8000? (${err})</td></tr>`;
      });

    function renderTable(trains) {
      const body = document.getElementById("fleetBody");
      body.innerHTML = "";
      trains.forEach(train => {
        const row = document.createElement("tr");
        const priorityClass = train.priority_bucket.replace(/ /g, "-");
        row.innerHTML = `
          <td>${train.train_id}</td>
          <td class="${priorityClass}">${train.priority_bucket}</td>
          <td>${(train.failure_probability * 100).toFixed(1)}%</td>
          <td>${train.predicted_failure_type || "-"}</td>
        `;
        row.onclick = () => showDetail(train.train_id);
        body.appendChild(row);
      });
    }

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim();
      renderTable(q ? allTrains.filter(t => String(t.train_id).includes(q)) : allTrains);
    });

    function showDetail(trainId) {
      fetch(`${FLEET_API}/trains/${trainId}`)
        .then(res => res.json())
        .then(data => {
          const modal = document.getElementById("modalContent");
          modal.innerHTML = `
            <h3>Train ${data.train_id}</h3>
            <div class="modal-row"><span>Priority</span><b>${data.priority_bucket}</b></div>
            <div class="modal-row"><span>Failure Probability</span><b>${(data.failure_probability*100).toFixed(1)}%</b></div>
            <div class="modal-row"><span>Predicted Issue</span><b>${data.predicted_failure_type || "-"}</b></div>
            <div class="modal-row"><span>Anomaly Flagged</span><b>${data.is_anomaly ? "Yes" : "No"}</b></div>
            <div class="modal-row"><span>Bearing Temp</span><b>${data.bearing_temperature_c ?? "-"}</b></div>
            <div class="modal-row"><span>Wheel Wear %</span><b>${data.wheel_wear_percent ?? "-"}</b></div>
            <div class="modal-row"><span>Brake Pad Wear %</span><b>${data.brake_pad_wear_percent ?? "-"}</b></div>
            <button class="modal-close" onclick="closeModal()">Close</button>
          `;
          document.getElementById("modalOverlay").style.display = "flex";
        });
    }
    function closeModal() { document.getElementById("modalOverlay").style.display = "none"; }

    // ---- Image tab ----
    const fileInput = document.getElementById("fileInput");
    const uploadBox = document.getElementById("uploadBox");

    fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));

    uploadBox.addEventListener("dragover", (e) => { e.preventDefault(); uploadBox.classList.add("dragover"); });
    uploadBox.addEventListener("dragleave", () => uploadBox.classList.remove("dragover"));
    uploadBox.addEventListener("drop", (e) => {
      e.preventDefault();
      uploadBox.classList.remove("dragover");
      handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      const preview = document.getElementById("imagePreview");
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";

      const resultBox = document.getElementById("imageResult");
      resultBox.style.display = "block";
      resultBox.className = "";
      resultBox.innerText = "Analyzing...";

      const formData = new FormData();
      formData.append("file", file);

      fetch(`${IMAGE_API}/predict/image`, { method: "POST", body: formData })
        .then(res => res.json())
        .then(data => {
          const cls = data.predicted_class;
          const conf = (data.confidence * 100).toFixed(1);
          resultBox.className = "result-" + cls.replace(/ /g, "");
          resultBox.innerText = `Prediction: ${cls} (${conf}% confidence)`;
        })
        .catch(err => {
          resultBox.className = "";
          resultBox.innerText = "Error: is the image backend running on port 8001? " + err;
        });
    }
  </script>
</body>
</html>
